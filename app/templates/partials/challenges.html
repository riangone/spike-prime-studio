{% if lesson.challenges %}
<div class="rounded-xl border border-success/40 bg-success/10 p-3.5 space-y-2">
  <div class="text-xs font-bold uppercase tracking-wider text-success">🏆 {{ ui.challenges_title }}</div>
  <ol class="space-y-1.5">
    {% for c in lesson.challenges %}
    <li class="flex items-start gap-2 text-xs sm:text-sm leading-relaxed">
      <span class="badge badge-success badge-sm mt-0.5 shrink-0 font-mono">{{ loop.index }}</span>
      <span>{{ c }}</span>
    </li>
    {% endfor %}
  </ol>
</div>
{% endif %}
